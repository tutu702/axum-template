[package]
name = "axum-template"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.25"
dotenvy = "0.15.7"
headers = "0.4.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
